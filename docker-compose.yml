services:
  postgres:
    image: postgres:16-alpine
    container_name: my-place-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myplace_db
      POSTGRES_USER: myplace_user
      POSTGRES_PASSWORD: myplace_pass
    ports:
      - "5432:5432"
    volumes:
      - my-place-postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myplace_user -d myplace_db"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  my-place-postgres-data:
